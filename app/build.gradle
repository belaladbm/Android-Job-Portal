plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.google.gms.google.services)
}


// properties object to access key value
def credentialsProperties = new Properties()

//accessing file
def credentialsPropertiesFile = rootProject.file("local.properties")

if(credentialsPropertiesFile.exists()) {
//input the file
    credentialsProperties.load(new FileInputStream(credentialsPropertiesFile))
}


// properties object to access key value
def defaultCredentialsProperties = new Properties()
//accessing file
def defaultCredentialsPropertiesFile = rootProject.file("local.defaults.properties")

if(defaultCredentialsPropertiesFile.exists()) {
//input the file
    defaultCredentialsProperties.load(new FileInputStream(defaultCredentialsPropertiesFile))
}


android {
    namespace 'com.example.group14_projectiteration1_quickcash'
    compileSdk 35
    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "com.example.group14_projectiteration1_quickcash"
        minSdk 30
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        //        accessing variable -  type, name of variable, concat with string format (adding "")

        if(credentialsProperties["PAYPAL_CLIENT_ID"] != null){
            buildConfigField "String", "PAYPAL_CLIENT_ID", ("\"".concat(credentialsProperties["PAYPAL_CLIENT_ID"]).concat("\""))
        } else if(defaultCredentialsProperties["PAYPAL_CLIENT_ID"] != null){
            buildConfigField "String", "PAYPAL_CLIENT_ID", ("\"".concat(defaultCredentialsProperties["PAYPAL_CLIENT_ID"]).concat("\""))
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.firebase.database
    implementation libs.firebase.ai
    implementation libs.recyclerview
    implementation libs.play.services.maps
    implementation libs.espresso.intents
    implementation libs.espresso.contrib
    implementation libs.firebase.auth

    //paypal dependencies
    implementation 'com.paypal.sdk:paypal-android-sdk:2.16.0'
    implementation libs.play.services.location
    implementation libs.ext.junit
    implementation libs.firebase.messaging

    testImplementation libs.junit
    testImplementation libs.core
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation 'androidx.test:rules:1.5.0'

}